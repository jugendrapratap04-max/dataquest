<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Site banner reading The Practice Site">
  <!-- 640x160 on purpose: the width/height exercise quotes these numbers. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4e5f"/>
      <stop offset="1" stop-color="#3a7ca5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="160" fill="url(#g)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2">
    <circle cx="560" cy="30" r="52"/>
    <circle cx="600" cy="120" r="80"/>
    <circle cx="70" cy="140" r="60"/>
  </g>
  <text x="48" y="88" font-family="Georgia, serif" font-size="40" fill="#ffffff">The Practice Site</text>
  <text x="50" y="118" font-family="monospace" font-size="15" fill="#cfe3ee">built one element at a time</text>
</svg>
