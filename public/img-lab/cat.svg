<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="A grey cat curled up asleep">
  <!-- Practice asset for the HTML course's Images module. Drawn by hand so the
       whole lab folder stays a few KB and ships with the repo. -->
  <rect width="240" height="200" fill="#f6f1e7"/>
  <ellipse cx="120" cy="150" rx="88" ry="34" fill="#e8dfce"/>
  <!-- body -->
  <ellipse cx="118" cy="122" rx="72" ry="48" fill="#8a8f98"/>
  <!-- tail wrapped around -->
  <path d="M46 132 q-18 22 12 30 q26 7 44 -6" fill="none" stroke="#6f747d" stroke-width="14" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="168" cy="96" r="34" fill="#9aa0a8"/>
  <!-- ears -->
  <path d="M146 74 l-6 -20 l20 8 z" fill="#9aa0a8"/>
  <path d="M186 70 l4 -20 l14 16 z" fill="#9aa0a8"/>
  <path d="M148 72 l-3 -11 l11 5 z" fill="#e3a6a6"/>
  <path d="M187 69 l2 -11 l8 9 z" fill="#e3a6a6"/>
  <!-- sleeping eyes -->
  <path d="M154 98 q6 5 12 0" fill="none" stroke="#3c4046" stroke-width="3" stroke-linecap="round"/>
  <path d="M176 98 q6 5 12 0" fill="none" stroke="#3c4046" stroke-width="3" stroke-linecap="round"/>
  <!-- nose + mouth -->
  <path d="M169 108 l4 4 l-8 0 z" fill="#e3a6a6"/>
  <path d="M169 112 q0 6 -7 6 M169 112 q0 6 7 6" fill="none" stroke="#3c4046" stroke-width="2" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M148 108 h-22 M150 114 l-20 6 M190 108 h22 M188 114 l20 6" stroke="#6f747d" stroke-width="2" stroke-linecap="round"/>
  <!-- stripes -->
  <path d="M92 92 q10 14 0 30 M112 84 q10 18 2 40 M76 104 q8 10 2 24" fill="none" stroke="#6f747d" stroke-width="6" stroke-linecap="round"/>
  <!-- zzz -->
  <g fill="#6f747d" font-family="monospace" font-size="18" font-weight="bold">
    <text x="204" y="52">z</text>
    <text x="216" y="38" font-size="14">z</text>
    <text x="226" y="27" font-size="11">z</text>
  </g>
</svg>
